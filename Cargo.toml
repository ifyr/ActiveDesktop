[package]
name = "active_desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Windows live wallpaper: per-monitor MP4 behind desktop icons, per-monitor auto-freeze."
readme = "README.md"

[lib]
name = "active_desktop"
path = "src/lib.rs"

[[bin]]
name = "ActiveDesktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
simplelog = "0.12"
winreg = "0.52"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D10",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
]
